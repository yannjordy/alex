name: Build .deb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build du .deb
        run: npx electron-builder --linux deb --publish never

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: alex-assistant-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
